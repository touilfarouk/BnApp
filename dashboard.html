<!DOCTYPE html>
<html lang="en" x-data="dashboard()" x-init="init()">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrderApp &mdash; Products Dashboard</title>

    <!-- Tailwind config + CDN -->
    <script>
        window.tailwind = window.tailwind || {};
        window.tailwind.config = {
            darkMode: 'class'
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

    <style>
        body {
            overflow-y: hidden;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
    <!-- Mobile overlay -->
    <div x-show="isSideMenuOpen" x-transition.opacity class="fixed inset-0 z-30 bg-black/50 md:hidden" @click="isSideMenuOpen = false"></div>

    <!-- Sidebar -->
    <aside class="fixed inset-y-0 left-0 z-40 w-64 transform border-r border-gray-200 bg-white shadow-lg transition-transform duration-200 dark:border-gray-800 dark:bg-gray-800 md:translate-x-0"
        :class="isSideMenuOpen ? 'translate-x-0' : '-translate-x-full'" @click.away="isSideMenuOpen = false">
        <div class="flex items-center justify-between border-b border-gray-200 px-4 py-4 dark:border-gray-700">
            <span class="text-lg font-bold">Bneder Informatique</span>
            <button class="md:hidden" @click="isSideMenuOpen = false">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <nav class="px-4 py-4 text-sm space-y-1">
            <template x-for="item in navItems" :key="item.href">
                <a :href="item.href"
                   class="block rounded px-3 py-2 leading-tight text-gray-700 transition-colors hover:bg-gray-200 dark:text-gray-200 dark:hover:bg-gray-700">{{ item.label }}</a>
            </template>
        </nav>
    </aside>

    <!-- Top header -->
    <header class="fixed inset-x-0 top-0 z-20 flex items-center justify-between border-b border-gray-200 bg-white px-4 py-3 shadow md:ml-64 dark:border-gray-800 dark:bg-gray-800">
        <div class="flex items-center gap-3">
            <button class="md:hidden rounded p-2 hover:bg-gray-200 dark:hover:bg-gray-700" @click="isSideMenuOpen = !isSideMenuOpen">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <div class="hidden text-lg font-semibold md:block">Products Dashboard</div>
        </div>
        <div class="flex flex-1 justify-center px-4">
            <input type="search" placeholder="Search..."
                class="w-full max-w-md rounded-md border border-gray-300 bg-gray-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 dark:border-gray-700 dark:bg-gray-700 dark:text-gray-100" />
        </div>
        <div class="flex items-center gap-3">
            <button class="rounded p-2 hover:bg-gray-200 dark:hover:bg-gray-700" @click="toggleDark()">
                <template x-if="!dark">
                    <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd" />
                    </svg>
                </template>
                <template x-if="dark">
                    <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
                    </svg>
                </template>
            </button>
        </div>
    </header>

    <!-- Main content -->
    <main class="md:ml-64 pt-24 md:pt-24 min-h-screen overflow-y-auto bg-gray-50 px-6 pb-12 transition-colors duration-300 dark:bg-gray-900">
        <div class="mx-auto max-w-6xl space-y-8">
            <section class="rounded-2xl border border-gray-200 bg-white p-6 shadow-xl transition-colors duration-300 dark:border-gray-800 dark:bg-gray-800">
                <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                    <div>
                        <h1 class="text-2xl font-semibold text-gray-900 dark:text-gray-100">Remote Products</h1>
                        <p class="text-sm text-gray-500 dark:text-gray-400">Live snapshot from <code class="rounded bg-gray-100 px-1 text-xs dark:bg-gray-700">GET /orderapi/get-all-products.php</code></p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span id="productCount" class="text-sm font-medium text-gray-500 dark:text-gray-400">Loading…</span>
                        <button id="refreshButton" class="inline-flex items-center gap-2 rounded-lg bg-sky-600 px-4 py-2 font-medium text-white shadow hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2 focus:ring-offset-white dark:focus:ring-offset-gray-800">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="h-5 w-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 9.75a7.5 7.5 0 0112.864-3.864m2.636 4.614a7.5 7.5 0 01-12.864 3.864M2.25 9.75h2.25m-2.25 0V7.5m19.5 6.75h-2.25m2.25 0v2.25" />
                            </svg>
                            Refresh
                        </button>
                    </div>
                </div>

                <div id="alertContainer" class="mt-4 hidden rounded-xl border border-rose-300 bg-rose-100/70 px-4 py-3 text-sm text-rose-700 dark:border-rose-900 dark:bg-rose-900/40 dark:text-rose-200"></div>

                <div class="mt-4 overflow-hidden rounded-2xl border border-gray-200 shadow dark:border-gray-700">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200 text-sm dark:divide-gray-700">
                            <thead class="bg-gray-100 dark:bg-gray-700 dark:text-gray-200">
                                <tr>
                                    <th scope="col" class="px-4 py-3 text-left font-medium uppercase tracking-wide">ID</th>
                                    <th scope="col" class="px-4 py-3 text-left font-medium uppercase tracking-wide">Name</th>
                                    <th scope="col" class="px-4 py-3 text-left font-medium uppercase tracking-wide">Label</th>
                                    <th scope="col" class="px-4 py-3 text-left font-medium uppercase tracking-wide">Structure</th>
                                    <th scope="col" class="px-4 py-3 text-left font-medium uppercase tracking-wide">Personnel</th>
                                    <th scope="col" class="px-4 py-3 text-left font-medium uppercase tracking-wide">Accessories</th>
                                    <th scope="col" class="px-4 py-3 text-left font-medium uppercase tracking-wide">Updated</th>
                                </tr>
                            </thead>
                            <tbody id="productsTableBody" class="divide-y divide-gray-100 bg-white dark:divide-gray-700 dark:bg-gray-800"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>

        <footer class="mt-8 text-center text-xs text-gray-400 dark:text-gray-500">
            &copy; <span id="year"></span> OrderApp Remote Dashboard
        </footer>
    </main>

    <script>
        const API_BASE = 'http://105.96.71.114/orderapi/get-all-products.php';

        function dashboard() {
            const stored = localStorage.getItem('dark');
            const initialDark = stored ? JSON.parse(stored) : false;

            return {
                dark: initialDark,
                isSideMenuOpen: false,
                navItems: [
                  
                ],
                init() {
                    document.documentElement.classList.toggle('dark', this.dark);
                    this.$watch('dark', value => {
                        localStorage.setItem('dark', JSON.stringify(value));
                        document.documentElement.classList.toggle('dark', value);
                    });
                },
                toggleDark() {
                    this.dark = !this.dark;
                }
            };
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function formatDate(value) {
            if (!value) {
                return 'N/A';
            }
            const parsed = new Date(String(value).replace(' ', 'T'));
            if (Number.isNaN(parsed.getTime())) {
                return value;
            }
            return parsed.toLocaleString();
        }

        function renderProducts(products) {
            const tbody = document.getElementById('productsTableBody');
            tbody.innerHTML = '';

            if (!Array.isArray(products) || products.length === 0) {
                const row = document.createElement('tr');
                row.className = 'fade-in';
                const cell = document.createElement('td');
                cell.colSpan = 7;
                cell.className = 'px-4 py-6 text-center text-sm text-gray-500 dark:text-gray-400';
                cell.textContent = 'No products found.';
                row.appendChild(cell);
                tbody.appendChild(row);
                return;
            }

            const makeCell = (row, text, className) => {
                const cell = document.createElement('td');
                cell.className = className;
                cell.textContent = text;
                row.appendChild(cell);
                return cell;
            };

            products.forEach(product => {
                const row = document.createElement('tr');
                row.className = 'fade-in';

                makeCell(row, product.id ?? '', 'whitespace-nowrap px-4 py-3 font-medium text-gray-700 dark:text-gray-200');
                makeCell(row, product.name ?? '', 'whitespace-nowrap px-4 py-3 text-gray-700 dark:text-gray-200');
                makeCell(row, product.label ?? '', 'px-4 py-3 text-gray-500 dark:text-gray-300');
                makeCell(row, product.structure_name ?? '', 'px-4 py-3 text-gray-500 dark:text-gray-300');
                makeCell(row, product.assigned_personnel_name ?? '', 'px-4 py-3 text-gray-500 dark:text-gray-300');

                const accessoriesCell = document.createElement('td');
                accessoriesCell.className = 'px-4 py-3 text-sm';
                if (Array.isArray(product.accessories) && product.accessories.length > 0) {
                    const fragment = document.createDocumentFragment();
                    product.accessories.forEach(item => {
                        const chip = document.createElement('span');
                        chip.className = 'mr-1 inline-flex items-center rounded-full bg-sky-100 px-2 py-0.5 text-xs text-sky-700 dark:bg-sky-900/50 dark:text-sky-200';
                        chip.textContent = item;
                        fragment.appendChild(chip);
                    });
                    accessoriesCell.appendChild(fragment);
                } else {
                    const none = document.createElement('span');
                    none.className = 'text-gray-400 dark:text-gray-500';
                    none.textContent = 'None';
                    accessoriesCell.appendChild(none);
                }
                row.appendChild(accessoriesCell);

                makeCell(row, formatDate(product.updated_at), 'whitespace-nowrap px-4 py-3 text-gray-500 dark:text-gray-300');

                tbody.appendChild(row);
            });
        }

        function showAlert(message) {
            const alert = document.getElementById('alertContainer');
            alert.textContent = message;
            alert.classList.remove('hidden');
            alert.classList.add('fade-in');
        }

        function hideAlert() {
            const alert = document.getElementById('alertContainer');
            alert.classList.add('hidden');
            alert.textContent = '';
        }

        async function fetchProducts() {
            hideAlert();
            const refreshButton = document.getElementById('refreshButton');
            const productCount = document.getElementById('productCount');
            refreshButton.disabled = true;
            refreshButton.classList.add('opacity-70');
            productCount.textContent = 'Loading…';

            try {
                const response = await fetch(API_BASE, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`Server responded with ${response.status}`);
                }
                const payload = await response.json();
                if (!payload || payload.success !== true) {
                    throw new Error(payload?.message || 'Unexpected response from server.');
                }

                renderProducts(payload.products);
                productCount.textContent = `${payload.count ?? payload.products.length} products`;
            } catch (error) {
                showAlert(error.message || 'Unable to reach the server. Please try again.');
                renderProducts([]);
                productCount.textContent = '0 products';
            } finally {
                refreshButton.disabled = false;
                refreshButton.classList.remove('opacity-70');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('year').textContent = new Date().getFullYear();
            document.getElementById('refreshButton').addEventListener('click', fetchProducts);
            fetchProducts();
        });
    </script>
</body>

</html>
